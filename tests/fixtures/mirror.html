<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Espelho de Ponto - Ahgora</title>
  <style>
    body { font-family: 'Segoe UI', sans-serif; margin: 20px; background: #f5f5f5; }
    .espelho-saldo { text-align: center; margin: 20px auto; padding: 12px; background: #fff; border-radius: 8px; max-width: 300px; font-weight: bold; }
    .espelho-saldo .text { display: inline-block; }
    .espelho-saldo .value { color: #22c55e; margin-left: 8px; }
    .v-calendar-weekly { display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; max-width: 900px; margin: 0 auto; }
    .v-calendar-weekly__day { background: #fff; border: 1px solid #ddd; border-radius: 6px; min-height: 120px; padding: 8px; position: relative; }
    .v-calendar-weekly__day-label { font-weight: bold; color: #333; margin-bottom: 6px; display: block; }
    .v-calendar-weekly__day.v-present { border-color: #6366f1; background: #eef2ff; }
    .v-calendar-weekly__day.v-future { opacity: 0.6; }
    .v-calendar-weekly__day.v-weekend { background: #fafafa; }
    .v-calendar-weekly__day.v-outside { opacity: 0.3; }
    .batida { display: inline-block; background: #e0e7ff; color: #312e81; padding: 2px 6px; border-radius: 4px; margin: 2px; font-size: 12px; }
    .batida.original { background: #e0e7ff; color: #312e81; }
    .batida.manual { background: #fef3c7; color: #92400e; }
    .batida.prevista { background: #f3f4f6; color: #9ca3af; border: 1px dashed #9ca3af; }
    .icon-attach i { font-size: 14px; }
  </style>
</head>
<body>
  <h1 style="text-align:center;">Espelho de Ponto</h1>

  <div class="espelho-saldo">
    <span class="text">Hours bank balance</span>
    <span class="value">+04:32</span>
  </div>

  <div class="v-calendar-weekly">
    <!-- Semana anterior (v-outside) -->
    <div class="v-calendar-weekly__day v-outside"><span class="v-calendar-weekly__day-label">30</span></div>
    <div class="v-calendar-weekly__day"><span class="v-calendar-weekly__day-label">1</span>
      <div class="espelho-batidas">
        <span class="v-tooltip batida v-tooltip--top original">08:00</span>
        <span class="v-tooltip batida v-tooltip--top original">12:00</span>
        <span class="v-tooltip batida v-tooltip--top manual">13:00</span>
        <span class="v-tooltip batida v-tooltip--top original">17:00</span>
      </div>
      <div class="icon-attach"><i class="material-icons success--text">mode_comment</i></div>
    </div>
    <div class="v-calendar-weekly__day"><span class="v-calendar-weekly__day-label">2</span>
      <div class="espelho-batidas">
        <span class="v-tooltip batida v-tooltip--top original">08:05</span>
        <span class="v-tooltip batida v-tooltip--top original">12:05</span>
        <span class="v-tooltip batida v-tooltip--top original">13:05</span>
        <span class="v-tooltip batida v-tooltip--top original">17:05</span>
      </div>
    </div>
    <div class="v-calendar-weekly__day"><span class="v-calendar-weekly__day-label">3</span>
      <div class="espelho-batidas">
        <span class="v-tooltip batida v-tooltip--top original">08:00</span>
        <span class="v-tooltip batida v-tooltip--top original">12:00</span>
        <span class="v-tooltip batida v-tooltip--top original">13:00</span>
        <span class="v-tooltip batida v-tooltip--top original">17:00</span>
      </div>
    </div>
    <div class="v-calendar-weekly__day"><span class="v-calendar-weekly__day-label">4</span>
      <div class="espelho-batidas">
        <span class="v-tooltip batida v-tooltip--top original">08:00</span>
        <span class="v-tooltip batida v-tooltip--top original">12:00</span>
        <span class="v-tooltip batida v-tooltip--top original">13:00</span>
        <span class="v-tooltip batida v-tooltip--top original">17:00</span>
      </div>
    </div>
    <div class="v-calendar-weekly__day"><span class="v-calendar-weekly__day-label">5</span>
      <div class="espelho-batidas">
        <span class="v-tooltip batida v-tooltip--top original">08:00</span>
        <span class="v-tooltip batida v-tooltip--top original">12:00</span>
        <span class="v-tooltip batida v-tooltip--top original">13:00</span>
        <span class="v-tooltip batida v-tooltip--top original">17:00</span>
      </div>
    </div>
    <div class="v-calendar-weekly__day v-weekend"><span class="v-calendar-weekly__day-label">6</span></div>

    <!-- Semana atual -->
    <div class="v-calendar-weekly__day v-weekend"><span class="v-calendar-weekly__day-label">7</span></div>
    <div class="v-calendar-weekly__day"><span class="v-calendar-weekly__day-label">8</span>
      <div class="espelho-batidas">
        <span class="v-tooltip batida v-tooltip--top original">08:00</span>
        <span class="v-tooltip batida v-tooltip--top original">12:00</span>
        <span class="v-tooltip batida v-tooltip--top manual">13:00</span>
        <span class="v-tooltip batida v-tooltip--top original">17:00</span>
      </div>
    </div>
    <div class="v-calendar-weekly__day"><span class="v-calendar-weekly__day-label">9</span>
      <div class="espelho-batidas">
        <span class="v-tooltip batida v-tooltip--top original">08:00</span>
        <span class="v-tooltip batida v-tooltip--top original">12:00</span>
        <span class="v-tooltip batida v-tooltip--top original">13:00</span>
      </div>
    </div>
    <div class="v-calendar-weekly__day v-present"><span class="v-calendar-weekly__day-label">10</span>
      <div class="espelho-batidas">
        <span class="v-tooltip batida v-tooltip--top original">08:00</span>
        <span class="v-tooltip batida v-tooltip--top original">12:00</span>
        <span class="v-tooltip batida v-tooltip--top prevista"></span>
        <span class="v-tooltip batida v-tooltip--top prevista"></span>
      </div>
    </div>
    <div class="v-calendar-weekly__day v-future"><span class="v-calendar-weekly__day-label">11</span></div>
    <div class="v-calendar-weekly__day v-future"><span class="v-calendar-weekly__day-label">12</span></div>
    <div class="v-calendar-weekly__day v-weekend v-future"><span class="v-calendar-weekly__day-label">13</span></div>
  </div>
<!-- impeccable-live-start --><!-- impeccable-live-end -->
</body>
</html>
